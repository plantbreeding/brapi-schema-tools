comparisonAPI: OpenApiCompare
html:
    title: Changelog
    linkCss: http://deepoove.com/swagger-diff/stylesheets/demo.css
    showAllChanges: false
json:
    prettyPrint: true
markdown:
    showChangedMetadata: true
ignoreMissingEndpoints:
    - /vendor/\S+
ignoreDepreciatedEndpoints: true
ignoreDescriptions: true
# Canonicalise equivalent nullable $ref encodings (anyOf/oneOf + null vs allOf + nullable)
# so openapi-diff does not report false type changes (object -> null).
normalizeNullableSchemas: true
